<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة الجوال · Quiet Zone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath fill='%23fff' d='M7 7h8v8H7zm2 2v4h4V9zm8-2h8v8h-8zm2 2v4h4V9zM7 17h8v8H7zm2 2v4h4v-4zm8-2h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z'/%3E%3C/svg%3E">
<style>
  /* Page around the phone */
  :root {
    --page: #e9ecf2;
    --text: #334155;
    --frame: #1c1d21;
    --frame-edge: #3a3c43;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #07080b; --text: #aab2c0; --frame-edge: #4a4d55; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% 20%, color-mix(in srgb, var(--page) 80%, #fff 20%), var(--page));
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    color: var(--text);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* The phone is drawn at real size (iPhone 15: 393 × 852 screen), then scaled to fit the window */
  .stage { transform-origin: center center; }
  .phone {
    position: relative;
    width: 393px; height: 852px;
    padding: 0;
    border-radius: 58px;
    background: var(--frame);
    box-shadow:
      0 0 0 11px var(--frame),               /* bezel */
      0 0 0 13px var(--frame-edge),          /* metal edge */
      0 40px 80px -20px rgba(0, 0, 0, .55),
      0 20px 40px -20px rgba(0, 0, 0, .4);
  }
  /* side buttons */
  .phone::before, .phone::after {
    content: ""; position: absolute; width: 4px; border-radius: 2px; background: var(--frame-edge);
  }
  .phone::before { right: -17px; top: 220px; height: 96px; }                     /* power */
  .phone::after  { left: -17px; top: 180px; height: 62px; box-shadow: 0 86px 0 var(--frame-edge); } /* volume */

  .screen {
    position: absolute; inset: 0;
    border-radius: 48px;
    overflow: hidden;
    background: #fff;
    display: flex; flex-direction: column;
  }
  @media (prefers-color-scheme: dark) { .screen { background: #0b0d12; } }

  /* Status bar with the camera "island" */
  .status {
    flex: 0 0 54px;
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 34px 0;
    direction: ltr;
    font: 600 16px/1 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: #0f172a;
    background: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) { .status { color: #f1f5f9; background: #0b0d12; } }
  .island {
    position: absolute; left: 50%; top: 11px; transform: translateX(-50%);
    width: 124px; height: 36px; border-radius: 20px; background: #000;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }

  iframe {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    display: block;
    background: transparent;
  }

  .home-indicator {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px;
    background: rgba(15, 23, 42, .85);
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) { .home-indicator { background: rgba(241, 245, 249, .85); } }

  .caption {
    position: fixed; bottom: 14px; left: 0; right: 0;
    text-align: center; font-size: 13px; opacity: .8;
  }
  .caption a { color: inherit; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone" role="group" aria-label="معاينة الموقع على شاشة جوال">
      <div class="screen">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="island"></span>
          <span class="status-icons">
            <!-- signal -->
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <!-- wifi -->
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.8L4.4 7c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.5l1.6-1.9C9.2 9.2 8.6 9 8 9Z"/></svg>
            <!-- battery -->
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
          </span>
        </div>
        <iframe src="index.html" title="Quiet Zone — مولّد رموز QR"></iframe>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <p class="caption">معاينة بمقاس الجوال (393 × 852) · <a href="index.html">افتح الموقع بالحجم الكامل</a></p>

<script>
  // Shrinks the phone so it always fits the window (it never grows past real size).
  (function () {
    var stage = document.getElementById('stage');
    function fit() {
      var scale = Math.min(1, (window.innerHeight - 80) / 880, (window.innerWidth - 40) / 420);
      stage.style.transform = 'scale(' + Math.max(scale, 0.3) + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
